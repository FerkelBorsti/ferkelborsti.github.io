<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>KC Knüppeldick – Strafen unserer Gäste</title>
<meta name="theme-color" content="#0E0C10">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&display=swap">
<!--
  Gäste-Seite des KC Knüppeldick (App 1.62 / Backend 1.57, 01.11.2026)

  Eine Seite OHNE Anmeldung für die Gäste eines einzigen Termins. Der Code
  steht hinter dem # in der Adresse und geht damit nie an den Webserver,
  nur an das Backend. Das Backend gibt ausschließlich heraus, was hier
  steht: die Namen der Gäste, ihre Strafen, ob sie bezahlt haben, Empfänger
  und IBAN. Kein Kegelbruder, keine Vereinszahl.

  Der Link gilt, bis alle Gäste bezahlt haben, und danach noch 14 Tage.
  Der Service Worker der App lässt diese Datei bewusst in Ruhe (sw.js).

  02.11.2026 (2): schneller – der letzte Stand liegt im Handy und steht sofort
  da, Platzhalter beim ersten Öffnen, Aktualisieren beim Zurückkehren, der
  eigene Name bleibt gewählt.
  02.11.2026: näher an die App gerückt – kein Zoomen, Kopf mit Logo und
  Schriftzug wie in der App, Logo antippen zeigt es groß, Weihnachtslogo vom
  1. Advent bis 6. Januar, Runterziehen zum Aktualisieren.
-->
<style>
:root{
  --ink:#0E0C10; --surface:#17141B; --surface-2:#211C28; --line:#2E2736;
  --text:#F6F2F5; --muted:#A79FAE;
  --accent:#DB1E72; --accent-soft:#ECA8C1; --accent-tint:rgba(219,30,114,.17);
  --ok:#3FBF8F; --ok-tint:rgba(63,191,143,.15); --warn:#E8B14A; --warn-tint:rgba(232,177,74,.15);
  --veil:rgba(6,5,7,.93);
  --radius:14px; color-scheme:dark;
  font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: light){
  :root{
    --ink:#F7F3F6; --surface:#FFFFFF; --surface-2:#F0E9EE; --line:#E3D8E0;
    --text:#1B141E; --muted:#6B5F71;
    --accent:#C2185B; --accent-soft:#93103F; --accent-tint:rgba(194,24,91,.10);
    --ok:#1B7D59; --ok-tint:rgba(27,125,89,.12); --warn:#8A5D0C; --warn-tint:rgba(138,93,12,.12);
    --veil:rgba(247,243,246,.96);
    color-scheme:light;
  }
}
*{box-sizing:border-box}
/* Kein versehentliches Zoomen – wie in der App: weder mit zwei Fingern noch
   per Doppeltipp. Safari im Browser ignoriert user-scalable=no; dafür stehen
   unten zusätzlich die gesture-Sperren im Skript. */
html{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
button,a,input{touch-action:manipulation}
html,body{margin:0;background:var(--ink);color:var(--text);-webkit-font-smoothing:antialiased}
.shell{max-width:460px;margin:0 auto;padding:0 0 calc(env(safe-area-inset-bottom) + 40px)}
/* Kopf wie in der App: Logo-Marke und Schriftzug */
header.app{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;
  border-bottom:1px solid var(--line);background:var(--ink)}
.badge{width:56px;height:56px;flex:none;background-color:transparent;background-size:contain;background-repeat:no-repeat;
  background-position:center;border:none;padding:0;cursor:pointer}
.badge:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.wordmark{flex:1;min-width:0;line-height:1.1}
.wordmark img{display:block;width:100%;max-width:212px;height:auto}
.wordmark span{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;margin-top:5px}
main{padding:22px 18px 0}
/* Logo groß – wie die Lightbox der App */
.lightbox{position:fixed;inset:0;background:var(--veil);z-index:30;display:grid;place-items:center;
  padding:calc(22px + env(safe-area-inset-top)) 28px 28px;cursor:zoom-out;border:none;width:100%;font:inherit}
.lightbox[hidden]{display:none}
.lightbox img{max-width:100%;max-height:70vh;width:auto;height:auto}
.lightbox p{color:var(--muted);font-size:12.5px;margin-top:18px;text-align:center}
/* Runterziehen zum Aktualisieren – wie in der App */
.ziehen{position:fixed;top:0;left:0;right:0;max-width:460px;margin:0 auto;z-index:8;
  display:flex;align-items:flex-end;justify-content:center;pointer-events:none;
  color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  overflow:hidden;height:0;background:var(--ink)}
.ziehen span{padding-bottom:8px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-soft)}
h1{font-family:'Archivo Black',sans-serif;font-size:26px;line-height:1.15;margin:6px 0 4px}
.sub{color:var(--muted);font-size:13.5px;line-height:1.45}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.summe{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.gross{font-family:'Archivo Black',sans-serif;font-size:30px;line-height:1}
.balken{height:8px;border-radius:6px;background:var(--surface-2);margin-top:14px;overflow:hidden}
.balken i{display:block;height:100%;background:var(--ok);border-radius:6px}
.mini{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);margin-top:8px}
h2{font-family:'Archivo Black',sans-serif;font-size:15px;letter-spacing:.02em;margin:28px 0 4px}
.note{color:var(--muted);font-size:13px;line-height:1.45;margin:4px 0 0}
.gast{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-top:10px;overflow:hidden}
.gast > button{all:unset;box-sizing:border-box;display:flex;width:100%;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.av{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--accent-soft);flex:none}
.gast .n{flex:1;min-width:0}
.gast .n b{display:block;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gast .n span{color:var(--muted);font-size:12.5px}
.betrag{font-family:'Archivo Black',sans-serif;font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
.pille{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;margin-top:4px}
.pille.offen{background:var(--warn-tint);color:var(--warn)}
.pille.bez{background:var(--ok-tint);color:var(--ok)}
.gast.bezahlt .betrag{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.pfeil{color:var(--muted);transition:transform .2s;font-size:16px}
.gast.auf .pfeil{transform:rotate(90deg)}
.details{display:none;border-top:1px solid var(--line);padding:6px 16px 14px}
.gast.auf .details{display:block}
.z{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.z:last-of-type{border-bottom:0}
.z small{color:var(--muted);margin-left:6px;white-space:nowrap}
.z span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{all:unset;box-sizing:border-box;display:block;text-align:center;width:100%;margin-top:10px;padding:11px;border-radius:11px;
  border:1px solid var(--line);color:var(--text);font-weight:700;font-size:14px;cursor:pointer}
.wahl{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{all:unset;cursor:pointer;font-size:13px;font-weight:600;padding:7px 12px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
.chip.an{background:var(--accent-tint);border-color:var(--accent);color:var(--text)}
.chip[disabled]{opacity:.4;cursor:default}
.zahl{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:8px}
.zahl[disabled]{opacity:.55;cursor:default}
.zahl .tx{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.zahl .tx b{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.zahl .tx span{font-size:15px;overflow-wrap:anywhere}
.mono{font-family:'Archivo Black',monospace;font-size:14px!important;letter-spacing:.05em;word-spacing:.15em}
.cp{font-size:12px;font-weight:700;color:var(--accent-soft)}
.zahl.ok .cp{color:var(--ok)}
.fuss{margin-top:26px;font-size:12px;color:var(--muted);line-height:1.5;text-align:center}
.fuss b{color:var(--text);font-weight:600}
.leer{margin-top:28px;text-align:center}
.leer p{color:var(--muted);font-size:14px;line-height:1.5}
.lade{color:var(--muted);font-size:14px;margin-top:40px;text-align:center}
/* Platzhalter beim allerersten Öffnen (02.11.2026) */
.sk{background:var(--surface-2);border-radius:8px;position:relative;overflow:hidden}
.sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);animation:sk 1.3s infinite}
@media (prefers-color-scheme: light){ .sk::after{background:linear-gradient(90deg,transparent,rgba(0,0,0,.05),transparent)} }
@keyframes sk{100%{transform:translateX(100%)}}
@media (prefers-reduced-motion: reduce){ .sk::after{animation:none} }
.status{font-size:12px;color:var(--muted);margin-top:10px;min-height:16px}
.status.warn{color:var(--warn)}
</style>
</head>
<body>
<div class="ziehen" id="ziehen" aria-hidden="true"><span id="ziehenText"></span></div>
<div class="shell">
  <header class="app">
    <button class="badge" id="badge" type="button" aria-label="Logo groß anzeigen"></button>
    <div class="wordmark"><img id="wortmarke" alt="KC Knüppeldick"><span>Strafen unserer Gäste</span></div>
  </header>
  <main id="inhalt" aria-busy="true">
    <div class="sk" style="width:46%;height:12px"></div>
    <div class="sk" style="width:78%;height:28px;margin-top:12px"></div>
    <div class="sk" style="width:92%;height:14px;margin-top:12px"></div>
    <div class="sk" style="height:118px;margin-top:22px;border-radius:14px"></div>
    <div class="sk" style="width:34%;height:16px;margin-top:30px"></div>
    <div class="sk" style="height:66px;margin-top:14px;border-radius:14px"></div>
    <div class="sk" style="height:66px;margin-top:10px;border-radius:14px"></div>
    <div class="sk" style="height:66px;margin-top:10px;border-radius:14px"></div>
  </main>
</div>
<button class="lightbox" id="lightbox" type="button" aria-label="Schließen" hidden>
  <div>
    <img id="lightboxImg" alt="Logo des KC Knüppeldick">
    <p>KC Knüppeldick · est. 27.07.2018 · zum Schließen tippen</p>
  </div>
</button>

<script>
/* Dieselbe Adresse wie in der App (index.html, const API). */
const API = 'https://script.google.com/macros/s/AKfycbzNVsv3ApcgdWK3zo0uxdR4hrnll82WWPgRx8qYYwjeukBkg8FjgrWEjjJElcPs7Z6a/exec';

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur = n => (Number(n) || 0).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
const dat = iso => { const t = String(iso || '').split('-'); return t.length === 3 ? t[2] + '.' + t[1] + '.' + t[0] : String(iso || ''); };
const WOCHENTAG = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const tagText = iso => {
  const t = String(iso || '').split('-').map(Number);
  if (t.length !== 3) return dat(iso);
  return WOCHENTAG[new Date(t[0], t[1] - 1, t[2]).getDay()] + ', ' + dat(iso);
};
const uhr = s => { const m = String(s || '').match(/(\d{4}-\d{2}-\d{2})\s+(\d{2}:\d{2})/); return m ? dat(m[1]) + ', ' + m[2] + ' Uhr' : ''; };

/* ---------------------------------------------- Logo wie in der App
   Hell oder dunkel nach dem Handy, Weihnachtslogo vom 1. Advent bis zum
   6. Januar (dieselbe Rechnung wie in der App). Das Urlaubslogo hängt dort an
   den Terminen – die kennt diese Seite nicht, deshalb gibt es es hier nicht. */
function ersterAdvent(jahr){
  const d = new Date(jahr, 11, 24);
  d.setDate(24 - d.getDay());
  d.setDate(d.getDate() - 21);
  d.setHours(0, 0, 0, 0);
  return d;
}
function istWeihnachten(d){
  const j = d.getFullYear();
  if (d <= new Date(j, 0, 6, 23, 59)) return true;
  return d >= ersterAdvent(j);
}
const hellMq = window.matchMedia ? matchMedia('(prefers-color-scheme: light)') : null;
function logosSetzen(){
  const hell = !!(hellMq && hellMq.matches);
  const satz = istWeihnachten(new Date()) ? 'weihnachten' : 'standard';
  const ton = hell ? 'hell' : 'dunkel';
  $('badge').style.backgroundImage = 'url("logo/' + satz + '-' + ton + '-marke.png")';
  $('lightboxImg').src = 'logo/' + satz + '-' + ton + '-voll.png';
  $('wortmarke').src = 'logo/wortmarke-' + ton + '.png';
  const tc = document.querySelector('meta[name="theme-color"]');
  if (tc) tc.setAttribute('content', hell ? '#F7F3F6' : '#0E0C10');
}
logosSetzen();
try { hellMq && hellMq.addEventListener('change', logosSetzen); } catch (e) {}
$('badge').addEventListener('click', () => { $('lightbox').hidden = false; });
$('lightbox').addEventListener('click', () => { $('lightbox').hidden = true; });

/* ---------------------------------------------- Kein Zoomen
   Safari (auch im WhatsApp-Browser) hält sich nicht an user-scalable=no.
   Die gesture-Ereignisse gibt es nur dort; das touchmove mit zwei Fingern
   fängt die übrigen Browser. Doppeltipp verhindert touch-action im CSS. */
['gesturestart', 'gesturechange', 'gestureend'].forEach(t =>
  document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

let DATEN = null;
let gewaehlt = '';
let geholtUm = 0;              // wann zuletzt frisch geholt (ms)
let laeuftGerade = false;
let statusText = '', statusWarn = false;
const aufgeklappt = new Set(); // Karten, die offen bleiben, auch wenn neu gezeichnet wird

function code(){ return String(location.hash || '').replace(/^#/, '').replace(/[^a-f0-9]/gi, ''); }

/* Der letzte Stand im Handy (02.11.2026). Nur für die Anzeige: Er steht sofort
   da, während die frischen Zahlen im Hintergrund kommen, und ersetzt sie nie.
   Gespeichert wird nur, was das Backend ohnehin an diese Seite gibt. Kann der
   Browser nichts speichern (privater Modus), läuft alles wie vorher. */
const merkSchluessel = () => 'kc-gaeste:' + code();
const ichSchluessel  = () => 'kc-gaeste-ich:' + code();
function merkLesen(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
function merkSchreiben(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function merkLoeschen(k){ try { localStorage.removeItem(k); } catch (e) {} }

function status(text, warn){
  statusText = text || ''; statusWarn = !!warn;
  const el = $('status');
  if (el){ el.textContent = statusText; el.className = 'status' + (statusWarn ? ' warn' : ''); }
}

async function laden(){
  const c = code();
  if (c.length < 20) return hinweis('Dieser Link ist unvollständig.', 'Bitte den Link aus der Gruppe noch einmal ganz öffnen.');
  if (laeuftGerade) return;
  laeuftGerade = true;

  // Beim ersten Aufruf: den gemerkten Stand sofort zeigen.
  if (!DATEN){
    const alt = merkLesen(merkSchluessel());
    const ich = merkLesen(ichSchluessel());
    if (ich && typeof ich === 'string'){ gewaehlt = ich; aufgeklappt.add(ich); }
    if (alt && alt.gaeste){ DATEN = alt; statusText = 'Wird aktualisiert …'; statusWarn = false; zeichnen(); }
  } else status('Wird aktualisiert …');

  try {
    const r = await fetch(API + '?gaeste=' + encodeURIComponent(c), { cache: 'no-store' });
    const d = await r.json();
    if (d.fehler === 'unbekannt'){ merkLoeschen(merkSchluessel()); DATEN = null; return hinweis('Diesen Link gibt es nicht mehr.', 'Er wurde zurückgezogen oder war nie gültig.'); }
    if (d.abgelaufen){ merkLoeschen(merkSchluessel()); DATEN = null; return hinweis('Alles erledigt – danke!', 'Alle Gäste vom ' + (d.art || 'Termin') + ' am ' + dat(d.datum) + ' haben bezahlt. Der Link ist inzwischen abgelaufen.'); }
    if (d.fehler) throw new Error(d.fehler);
    DATEN = d;
    geholtUm = Date.now();
    merkSchreiben(merkSchluessel(), d);
    statusText = ''; statusWarn = false;
    zeichnen();
  } catch (e) {
    if (DATEN){
      // Lieber den letzten Stand mit klarem Hinweis als eine leere Seite.
      status('Gerade keine Verbindung – das ist der Stand vom ' + uhr(DATEN.stand) + '. Zum Aktualisieren nach unten ziehen.', true);
    } else {
      hinweis('Keine Verbindung.', 'Die Liste ließ sich nicht holen. Bitte bei besserem Empfang noch einmal öffnen.');
    }
  } finally {
    laeuftGerade = false;
    $('inhalt').removeAttribute('aria-busy');
  }
}

function hinweis(titel, text){
  $('inhalt').innerHTML = `<div class="leer"><h1>${esc(titel)}</h1><p>${esc(text)}</p>
    <button class="btn" type="button" id="nochmal">Noch einmal versuchen</button></div>`;
  $('nochmal').addEventListener('click', () => { $('inhalt').innerHTML = '<p class="lade">Einen Moment …</p>'; laden(); });
}

/* Zurück aus der Banking-App: Die Seite holt sich den neuesten Stand selbst –
   aber höchstens alle 20 Sekunden, damit kurzes Hin- und Herwechseln nicht
   jedes Mal eine Abfrage auslöst. */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !DATEN) return;
  if (Date.now() - geholtUm < 20000) return;
  laden();
});

function zeichnen(){
  const d = DATEN;
  const gaeste = d.gaeste || [];
  const kopf = `<div class="eyebrow">${esc(d.art === 'Kegelabend' ? 'Kegelabend mit Gästen' : (d.art || 'Termin') + ' mit Gästen')}</div>
    <h1>${esc(tagText(d.datum))}</h1>
    <div class="sub">Schön, dass ihr dabei wart! Hier steht, was an dem Abend zusammengekommen ist.</div>`;

  if (!gaeste.length){
    $('inhalt').innerHTML = kopf + `<div class="card" style="margin-top:18px"><p class="note" style="margin:0">
      Die Strafen werden gerade zusammengestellt. Schau in einer Weile noch einmal vorbei –
      der Link bleibt derselbe.</p></div>`;
    return;
  }

  const ges = gaeste.reduce((a, g) => a + g.summe, 0);
  const off = gaeste.reduce((a, g) => a + (g.bezahlt ? 0 : g.offen), 0);
  const nBez = gaeste.filter(g => g.bezahlt).length;
  const anteil = ges > 0 ? Math.max(0, Math.min(100, (ges - off) / ges * 100)) : 0;
  const offene = gaeste.filter(g => !g.bezahlt);
  if (gewaehlt && !offene.some(g => g.n === gewaehlt)) gewaehlt = '';

  // Alphabetisch nach Namen (Wunsch Johannes, 01.11.2026) – bezahlt oder nicht.
  const sortiert = gaeste.slice().sort((a, b) => a.n.localeCompare(b.n, 'de', { sensitivity: 'base' }));
  const karte = g => `
    <div class="gast${g.bezahlt ? ' bezahlt' : ''}${aufgeklappt.has(g.n) ? ' auf' : ''}" data-n="${esc(g.n)}">
      <button type="button" aria-expanded="${aufgeklappt.has(g.n)}">
        <div class="av">${esc((g.n || '?').charAt(0).toUpperCase())}</div>
        <div class="n"><b>${esc(g.n)}</b><span>${g.s.length === 1 ? '1 Posten' : g.s.length + ' Posten'}</span></div>
        <div style="text-align:right">
          <div class="betrag">${eur(g.summe)}</div>
          <span class="pille ${g.bezahlt ? 'bez' : 'offen'}">${g.bezahlt ? 'bezahlt' : 'offen'}</span>
        </div>
        <span class="pfeil" aria-hidden="true">›</span>
      </button>
      <div class="details">
        ${g.s.map(x => `<div class="z"><span>${esc(x.t)}${x.n ? `<small>${x.n} × ${eur(x.p)}</small>` : ''}</span><span>${eur(x.b)}</span></div>`).join('')}
        ${!g.bezahlt && Math.abs(g.offen - g.summe) > 0.004
          ? `<div class="z"><span>Davon noch offen</span><span>${eur(g.offen)}</span></div>` : ''}
        ${g.bezahlt ? '' : `<button class="btn" type="button" data-zahl="${esc(g.n)}">So bezahlst du ↓</button>`}
      </div>
    </div>`;

  $('inhalt').innerHTML = kopf + `
    <div class="card" style="margin-top:18px">
      <div class="summe">
        <div><div class="eyebrow" style="color:var(--muted)">Zusammen</div><div class="gross">${eur(ges)}</div></div>
        <div style="text-align:right"><div class="eyebrow" style="color:var(--muted)">Noch offen</div>
          <div style="font-family:'Archivo Black',sans-serif;font-size:18px;color:${off > 0 ? 'var(--warn)' : 'var(--ok)'}">${eur(off)}</div></div>
      </div>
      <div class="balken"><i style="width:${anteil}%"></i></div>
      <div class="mini"><span>${nBez} von ${gaeste.length} ${gaeste.length === 1 ? 'hat' : 'haben'} bezahlt</span><span>Stand ${esc(uhr(d.stand))}</span></div>
      <div class="status${statusWarn ? ' warn' : ''}" id="status" aria-live="polite">${esc(statusText)}</div>
    </div>

    <h2>Die Gäste</h2>
    <p class="note">Tippe einen Namen an, dann siehst du die einzelnen Strafen.</p>
    <div id="liste">${sortiert.map(karte).join('')}</div>

    ${offene.length ? `<h2>So zahlst du</h2>
    <p class="note">Überweise an die Kegelkasse. Wähle deinen Namen, dann stehen Betrag und
      Verwendungszweck schon richtig da. Tippe ein Feld an, dann liegt der Wert in der Zwischenablage.</p>
    <div class="wahl" id="wahl"></div>
    <div id="zahlfelder" style="margin-top:6px"></div>` : `<div class="card" style="margin-top:24px"><p class="note" style="margin:0">
      Alle haben bezahlt – vielen Dank!</p></div>`}

    <div class="fuss">
      Die Liste aktualisiert sich bei jedem Öffnen.<br>
      Als bezahlt gilt eine Strafe, sobald sie beim Kassenwart angekommen und abgehakt ist.<br>
      ${d.gueltigBis
        ? 'Dieser Link gilt noch bis <b>' + esc(dat(d.gueltigBis)) + '</b>.'
        : 'Dieser Link gilt, bis alle bezahlt haben, und danach noch ' + esc(d.nachlaufTage || 14) + ' Tage.'}
    </div>`;

  $('liste').querySelectorAll('.gast > button').forEach(b => b.addEventListener('click', () => {
    const k = b.parentElement; k.classList.toggle('auf');
    const auf = k.classList.contains('auf');
    b.setAttribute('aria-expanded', auf);
    if (auf) aufgeklappt.add(k.dataset.n); else aufgeklappt.delete(k.dataset.n);
  }));
  $('liste').querySelectorAll('[data-zahl]').forEach(b => b.addEventListener('click', () => {
    gewaehlt = b.dataset.zahl; merkSchreiben(ichSchluessel(), gewaehlt); zahlZeichnen();
    $('wahl').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }));
  if (offene.length) zahlZeichnen();
}

function zahlZeichnen(){
  const d = DATEN;
  const gaeste = (d.gaeste || []).slice().sort((a, b) => a.n.localeCompare(b.n, 'de'));
  $('wahl').innerHTML = gaeste.map(g => `<button class="chip${g.n === gewaehlt ? ' an' : ''}" type="button"
      data-w="${esc(g.n)}"${g.bezahlt ? ' disabled' : ''}>${esc(g.n)}${g.bezahlt ? ' ✓' : ''}</button>`).join('');
  $('wahl').querySelectorAll('[data-w]').forEach(b => b.addEventListener('click', () => {
    gewaehlt = gewaehlt === b.dataset.w ? '' : b.dataset.w;
    if (gewaehlt) merkSchreiben(ichSchluessel(), gewaehlt); else merkLoeschen(ichSchluessel());
    zahlZeichnen();
  }));

  const g = gaeste.filter(x => x.n === gewaehlt && !x.bezahlt)[0];
  const iban = String(d.kasse && d.kasse.iban || '').replace(/\s/g, '');
  const empf = (d.kasse && d.kasse.inhaber) || 'KC Knüppeldick';
  const betrag = g ? g.offen : 0;
  const zweck = g ? 'Gaststrafen ' + dat(d.datum) + ' ' + g.n : '';
  const felder = [
    { k: 'Empfänger', v: empf },
    { k: 'IBAN', v: iban ? iban.replace(/(.{4})/g, '$1 ').trim() : 'nicht hinterlegt – bitte beim Kassenwart fragen',
      kopie: iban, mono: !!iban, aus: !iban },
    { k: 'Betrag', v: g ? eur(betrag) : 'erst oben deinen Namen wählen',
      kopie: betrag.toFixed(2).replace('.', ','), mono: !!g, aus: !g },
    { k: 'Verwendungszweck', v: zweck || '—', aus: !g }
  ];
  $('zahlfelder').innerHTML = felder.map(f => `
    <button class="zahl" type="button" data-kopie="${esc(f.kopie != null ? f.kopie : f.v)}"${f.aus ? ' disabled' : ''}>
      <div class="tx"><b>${esc(f.k)}</b><span class="${f.mono ? 'mono' : ''}">${esc(f.v)}</span></div>
      ${f.aus ? '' : '<span class="cp">Kopieren</span>'}
    </button>`).join('')
    + (g && iban ? `<button class="zahl" type="button" data-kopie="${esc([empf, iban, betrag.toFixed(2).replace('.', ',') + ' EUR', zweck].join('\n'))}">
      <div class="tx"><b>Alles zusammen</b><span>Empfänger, IBAN, Betrag und Zweck als Block</span></div>
      <span class="cp">Kopieren</span></button>` : '');
  $('zahlfelder').querySelectorAll('.zahl:not([disabled])').forEach(b => b.addEventListener('click', () => kopiere(b)));
}

async function kopiere(b){
  const text = b.dataset.kopie;
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch (e) {
    try {
      const t = document.createElement('textarea'); t.value = text; t.setAttribute('readonly', '');
      t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select();
      ok = document.execCommand('copy'); document.body.removeChild(t);
    } catch (e2) {}
  }
  const s = b.querySelector('.cp'); if (!s) return;
  b.classList.toggle('ok', ok); s.textContent = ok ? 'Kopiert' : 'Ging nicht';
  setTimeout(() => { b.classList.remove('ok'); s.textContent = 'Kopieren'; }, 1600);
}

/* ---------------------------------------------- Runterziehen zum Aktualisieren
   Wie in der App: nur ganz oben und nur bei einem deutlichen Zug nach unten.
   Waagerechte Wischer (Namensauswahl) bleiben unberührt. */
(function(){
  const AUSLOESER = 70, MAX = 110;
  let startY = null, startX = null, aktiv = false, laeuft = false, hoehe = 0;
  const feld = $('ziehen'), text = $('ziehenText');
  const zeige = h => {
    hoehe = Math.round(h);
    feld.style.height = 'calc(env(safe-area-inset-top) + ' + hoehe + 'px)';
    text.textContent = h >= AUSLOESER ? 'Loslassen zum Aktualisieren' : 'Zum Aktualisieren ziehen';
  };
  const zurueck = () => { hoehe = 0; feld.style.height = '0px'; aktiv = false; startY = null; };
  document.addEventListener('touchstart', e => {
    if (laeuft || e.touches.length !== 1 || window.scrollY > 0) return;
    if (!$('lightbox').hidden || e.target.closest('.wahl')) return;
    startY = e.touches[0].clientY; startX = e.touches[0].clientX; aktiv = false;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (startY === null || laeuft || e.touches.length !== 1) return;
    const dy = e.touches[0].clientY - startY, dx = Math.abs(e.touches[0].clientX - startX);
    if (dy <= 0 || dx > Math.abs(dy) || window.scrollY > 0) { zurueck(); return; }
    aktiv = true;
    zeige(Math.min(MAX, dy * 0.5));
  }, { passive: true });
  document.addEventListener('touchend', async () => {
    if (startY === null) return;
    if (aktiv && hoehe >= AUSLOESER){
      laeuft = true;
      feld.style.height = 'calc(env(safe-area-inset-top) + 40px)';
      text.textContent = 'Wird geladen …';
      try { await laden(); } finally { laeuft = false; zurueck(); }
    } else zurueck();
  });
  document.addEventListener('touchcancel', zurueck);
})();

window.addEventListener('hashchange', () => { gewaehlt = ''; laden(); });
laden();
</script>
</body>
</html>
